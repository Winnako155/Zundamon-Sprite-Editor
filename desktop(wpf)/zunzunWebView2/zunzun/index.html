<!--
俊达萌立绘编辑器
代码写的很烂捏轻点喷
·此项目采取小驼峰命名法



-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="font.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="rowList.css">
    <link rel="stylesheet" href="tip.css">
    <link rel="stylesheet" href="decideView.css">
    <link rel="stylesheet" href="aboutView.css">
    <link rel="stylesheet" href="dialog.css">
    <link rel="stylesheet" href="dialog_mode.css">
    <title>俊达萌立绘编辑器</title>
</head>
<body>
    <div class="tipList"> <!--提示视图-->
    </div>
    <div id="topBar"><!-- 顶部栏 -->
        <p style="color: var(--color-primary-dark); font-size: 15px;">俊达萌立绘编辑器</p>
        <div>
            <button id="button_nowActor" onclick="showDecideView()">当前立绘:???</button>
            <button id="button_Mode" onclick="showDialogMode('编辑器模式')">模式</button>
            <button id="button_Download" onclick="downloadSprite()">导出</button>
        </div>
    </div>
    <div id="mainView"><!-- 主视图 -->
        
        <div id="canvasView"><!--画布视图-->
            <canvas id="canvas" style="display: none;"></canvas> <!--隐藏起来，后期用img显示，这样不用调整大小(-->
            <canvas id="bqbCanvas" style="display: none;"></canvas>
            <img id="img_canvasResult" alt="展示区"  src="res/no-image.png" style="border-radius: 10px;">
            <div id="dragOverlay"></div> <!--透明手势层：接管触摸，避免 webview 长按图片触发原生拖拽-->
        </div>

        <div id="bqbView"><!--表情包设置视图-->
            <div style="display: flex; flex-direction: row; align-items: center; gap: 5px;">
                <p style="font-size: 30px; font-weight: bold;">表情包设置</p>
                <button id="button_toggleBqbView" onclick="toggleBqbView()">折叠</button>
            </div>
            <p style="margin-top: 10px;">人物大小</p>
            <div style="display: flex; flex-direction: row; align-items: center; gap: 5px;">
                <input type="range" min="0" max="500" step="1" value="100" style="flex: 1;" id="input_actorSize" />
                <p id="input_actorSizeText">100%</p>
                <button onclick="resetActorSize()">重置</button>
            </div>

            <p style="margin-top: 10px; display: flex; flex-direction: row; align-items: center; justify-content: space-between;">
                人物位置(也可直接拖拽)
                <button onclick="resetActorPosition()" style="margin-left: 5px;">重置</button>
            </p>
            <div style="display: flex; flex-direction: row; align-items: center; gap: 5px;">
                <p>X:</p>
                <input type="range" min="-1000" max="var(--canvasSizeX)" step="1" value="100" style="flex: 1;" id="input_actorPositionX" />
                <p id="input_actorPositionXText">px</p>
            </div>
            <div style="display: flex; flex-direction: row; align-items: center; gap: 5px; margin-top: 5px;">
                <p>Y:</p>
                <input type="range" min="-2000" max="var(--canvasSizeY)" step="1" value="100" style="flex: 1;" id="input_actorPositionY" />
                <p id="input_actorPositionYText">px</p>
            </div>

            <p style="margin-top: 10px;">人物旋转</p>
            <div style="display: flex; flex-direction: row; align-items: center; gap: 5px;">
                <input type="range" min="-180" max="180" step="1" value="0" style="flex: 1;" id="input_actorRotation" />
                <p id="input_actorRotationText">0°</p>
                <button onclick="resetActorRotation()">重置</button>
            </div>

            <p style="margin-top: 10px;">翻转</p>
            <div style="display: flex; flex-direction: row; align-items: center; gap: 5px;">
                <button onclick="toggleActorFlip()" id="button_actorFlip">左右翻转：关</button>
            </div>
            <p style="margin-top: 10px;">背景颜色</p>
            <input type="color" id="backgroundColorWell" value="#388E3C">

            <p style="margin-top: 10px;">字幕</p>
            <div style="display: flex; flex-direction: row; align-items: center; gap: 5px;">
                <p>文字:</p>
                <input type="text" id="input_subtitleText" placeholder="输入字幕..." style="flex: 1;" />
            </div>
            <div style="display: flex; flex-direction: row; align-items: center; gap: 5px; margin-top: 5px;">
                <p>字体:</p>
                <input type="color" id="subtitleColorWell" value="#FFFFFF">
                <p>描边:</p>
                <input type="color" id="subtitleStrokeColorWell" value="#000000">
            </div>
            <div style="display: flex; flex-direction: row; align-items: center; gap: 5px; margin-top: 5px;">
                <p>字体大小:</p>
                <input type="range" min="10" max="120" step="1" value="46" style="flex: 1;" id="input_subtitleFontSize" />
                <p id="input_subtitleFontSizeText">NaNpx</p>
            </div>
            <div style="display: flex; flex-direction: row; align-items: center; gap: 5px; margin-top: 5px;">
                <p>距底部:</p>
                <input type="range" min="0" max="500" step="1" value="26" style="flex: 1;" id="input_subtitleBottomMargin" />
                <p id="input_subtitleBottomMarginText">NaNpx</p>
            </div>
            <div style="display: flex; flex-direction: row; align-items: center; gap: 5px; margin-top: 5px;">
                <p>描边大小:</p>
                <input type="range" min="0" max="30" step="1" value="8" style="flex: 1;" id="input_subtitleStrokeSize" />
                <p id="input_subtitleStrokeSizeText">NaNpx</p>
            </div>
        </div>
        <div id="setView"><!-- 设置视图 -->
            <p style="font-size: 30px; font-weight: bold;">设置</p>
        </div>
    </div>

    <div id="decideView_backGround" onclick="hideDecideView()">
        <div id="aboutView">
            <div>
                <p style="font-size: 18px; vertical-align: top; margin-top: 0; color: rgb(255, 255, 255);">俊达萌立绘编辑器<font id="nowBuildText" style="font-size: 12px; vertical-align: top; color: rgba(255, 255, 255, 0.575);">NaN</font></p>
                <p style="font-size: 10px; color: rgba(255, 255, 255, 0.651);">使用和编辑立绘请遵循「官方规章」</p>
                <p style="font-size: 13px;width: 180px;color: rgba(255, 255, 255, 0.842);">能够更直观的编辑俊达萌立绘的小工具。</p>
                <a href="https://github.com/Winnako155/Zundamon-Sprite-Editor">项目 Github</a>
                <a href="https://space.bilibili.com/696501979">软件作者 BiliBili</a>
                <button onclick="checkUpdate()">检测更新</button>
            </div>
            <img src="res/example.png" style="max-width: 150px; position: absolute; bottom: 0; right: 0;">
            <p style="font-size: 10px; color: rgba(255, 255, 255, 0.651); position: absolute; top: 10px; right: 10px;">点击点击空白处退出</p>
        </div>    
    </div>
    <div id="decideView" style="z-index: 10000;">
        <p style="font-size: 30px;">立绘款式</p>
        <div id="decideView_itemList"></div>
    </div>
    <div id="dialogView_backGround"></div>
    <div id="dialogView">
        <h2 id="dialogView_title"></h2>
        <p id="dialogView_content"></p>
        <button onclick="hideDialogView()">确定</button>
    </div>
    <div id="dialogView_mode">
        <h1 style="margin-bottom: 20px;" id="dialogView_mode_title">编辑器模式</h1>
        <img src="res/img/mode_sprite.png" alt="完整立绘模式" id="dialogView_mode_sprite">
        <img src="res/img/mode_bqb.png" alt="表情包模式" id="dialogView_mode_bqb">
    </div>
</body>
<script src="rowList.js"></script>
<script src="dialog.js"></script>
<script src="scrpit.js"></script>
<script src="tip.js"></script>
<script src="decideView.js"></script>
<script src="checkUpdate.js"></script>
<script src="dialog_mode.js"></script>
<script>
    checkUpdate();
    hideDialogViewMode();
</script>
</html>
