plugins {
    id 'com.android.library'
}

android {
    namespace 'com.zunda.screenrecorder'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// 插件不依赖 AndroidX / Kotlin，避免和 5+ App 离线工程里的版本冲突。
dependencies {
}
